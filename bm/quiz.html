<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Architecture of Embedded Systems</title><style>body{margin:0;font-family:Segoe UI,Arial,sans-serif;background:#0f172a;color:white}.hero{padding:60px;text-align:center;background:linear-gradient(135deg,#2563eb,#06b6d4)}.container{max-width:1400px;margin:auto;padding:30px}.card{background:#1e293b;padding:25px;margin:20px 0;border-radius:18px}h2{color:#38bdf8}.quiz-option{padding:10px;margin:8px 0;background:#0f172a;border-radius:8px;cursor:pointer}.correct{background:#16a34a!important}.wrong{background:#dc2626!important}button{padding:12px 20px;background:#06b6d4;color:white;border:none;border-radius:8px}</style></head><body><div class="hero"><h1>Architecture of Embedded Systems</h1><p>Interactive Learning Module</p></div><div class="container"><div class="card"><h2>Knowledge Check</h2><div id="quizArea"></div><h3 id="score">Score: 0 / 11</h3><button onclick="location.reload()">Retake Quiz</button></div>


</div><script>const questions=[{question:'Which component stores program instructions?',options:['Sensor','Memory','Actuator','Power Supply'],answer:1},{question:'Which component is the brain of the embedded system?',options:['Processor','Sensor','Memory','Actuator'],answer:0},{question:'Which component collects information from the environment?',options:['Memory','Processor','Sensor','Power Supply'],answer:2},{question:'Which component performs physical actions?',options:['Actuator','Memory','Processor','Communication Module'],answer:0},{question:'What does RAM stand for?',options:['Random Access Memory','Read Access Module','Rapid Access Method','Remote Access Memory'],answer:0},{question:'Which component enables Wi‑Fi and Bluetooth communication?',options:['Communication Module','Actuator','Sensor','Memory'],answer:0},{question:'Which component connects external devices to the processor?',options:['Input/Output Interface','Memory','Sensor','Power Supply'],answer:0},{question:'A motion detector is an example of a:',options:['Sensor','Actuator','Processor','Memory'],answer:0},{question:'A motor is an example of a:',options:['Sensor','Actuator','Memory','Communication Module'],answer:1},{question:'Which component temporarily stores data while programs run?',options:['ROM','Processor','RAM','Actuator'],answer:2},{question:'Which sequence correctly represents data flow?',options:['Actuator → Sensor → Processor','Processor → Sensor → Memory','Sensor → Processor → Memory → Actuator','Memory → Actuator → Sensor'],answer:2}];let score=0;function loadQuiz(){let html='';questions.forEach((q,index)=>{html+=`<div style="background:#0f172a;padding:20px;border-radius:12px;margin-bottom:20px"><h3>${index+1}. ${q.question}</h3>${q.options.map((o,i)=>`<div class='quiz-option' onclick='checkAnswer(this,${index},${i})'>${o}</div>`).join('')}<div id='feedback${index}'></div></div>`});quizArea.innerHTML=html;}function checkAnswer(el,q,s){el.parentElement.querySelectorAll('.quiz-option').forEach(x=>x.style.pointerEvents='none');if(s===questions[q].answer){el.classList.add('correct');score++;document.getElementById('feedback'+q).innerHTML='✓ Correct';}else{el.classList.add('wrong');document.getElementById('feedback'+q).innerHTML='✗ Incorrect';}scoreEl=document.getElementById('score');scoreEl.innerHTML='Score: '+score+' / '+questions.length;}loadQuiz();</script></body></html>
